[package]
name = "app"
version = "0.1.0"
description = "An offline range companion for the Garmin Approach R10"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.94"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
libgolf-rs = { path = "../crate/libgolf-rs" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-blec = "0.12"
tauri-plugin-tts = "0.1"
tauri-plugin-store = "2"
tenover = { git = "https://github.com/fabriziosestito/10over", rev = "47cd442a82f51d8b82ed0e11f58ac1874bd8bd22", features = ["serde"] }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
